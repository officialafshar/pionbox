<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی نقطه و خط</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    body { font-family: Tahoma, sans-serif; text-align: center; background: #f4f4f9; padding: 10px; margin: 0; }
    #room-menu { margin-top: 50px; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #2ecc71; color: white; cursor: pointer; border: none; }
    
    #game-container { display: none; }
    #board { display: inline-grid; gap: 1px; background: #222; padding: 4px; border-radius: 8px; margin-top: 10px; direction: ltr;}
    
    /* ابعاد جدید برای جا شدن تخته بزرگ در موبایل */
    .dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; }
    .hline { width: 22px; height: 8px; background: #444; cursor: pointer; }
    .vline { width: 8px; height: 22px; background: #444; cursor: pointer; }
    .box { width: 22px; height: 22px; background: #333; transition: 0.2s; }
    
    .p1 { background: #e74c3c !important; }
    .p2 { background: #3498db !important; }
    .taken { pointer-events: none; }
    
    .room-badge { background: #333; color: #fff; padding: 5px 10px; border-radius: 5px; display: inline-block; letter-spacing: 2px;}
  </style>
</head>
<body>

  <h2>نقطه و خط آنلاین</h2>

  <!-- منوی ساخت و ورود به روم -->
  <div id="room-menu">
    <button onclick="createRoom()">ساخت بازی جدید (من قرمز)</button>
    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">
    <p>کد بازی دوستتان را وارد کنید:</p>
    <input type="number" id="joinCode" placeholder="مثال: 4821">
    <button onclick="joinRoom()" style="background: #3498db;">ورود (من آبی)</button>
  </div>

  <!-- محیط اصلی بازی -->
  <div id="game-container">
    <h3 class="room-badge" id="roomDisplay"></h3>
    <h4 id="score">قرمز: 0 | آبی: 0</h4>
    <p id="status">در حال اتصال...</p>
    <div id="board"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBPL2MDK71tCkqJe_mWnEM9yEmUKKJRNsE",
      authDomain: "dot-and-box-36ebb.firebaseapp.com",
      databaseURL: "https://dot-and-box-36ebb-default-rtdb.firebaseio.com",
      projectId: "dot-and-box-36ebb",
      storageBucket: "dot-and-box-36ebb.firebasestorage.app",
      messagingSenderId: "377564931303",
      appId: "1:377564931303:web:bbf65d3ced0e9b9e906e42"
    };

    firebase.initializeApp(firebaseConfig);
    
    let dbRef = null;
    const gridSize = 13; // 12x12 مربع
    let myPlayerId = null;
    let roomId = null;
    let gameState = { lines: {}, boxes: {}, turn: 1, score: {1: 0, 2: 0} };

    function createRoom() {
      roomId = Math.floor(1000 + Math.random() * 9000).toString(); // تولید کد 4 رقمی
      myPlayerId = 1;
      
      dbRef = firebase.database().ref('rooms/' + roomId);
      dbRef.set({ lines: {}, boxes: {}, turn: 1, score: {1: 0, 2: 0} });
      
      startGameUI();
    }

    function joinRoom() {
      const code = document.getElementById('joinCode').value;
      if (!code || code.length < 4) return alert('کد معتبر نیست!');
      
      const tempRef = firebase.database().ref('rooms/' + code);
      tempRef.once('value', snap => {
        if (snap.exists()) {
          roomId = code;
          myPlayerId = 2;
          dbRef = tempRef;
          startGameUI();
        } else {
          alert('بازی با این کد پیدا نشد!');
        }
      });
    }

    function startGameUI() {
      document.getElementById('room-menu').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';
      document.getElementById('roomDisplay').innerText = `کد بازی شما: ${roomId}`;
      
      initBoard();
      
      // اتصال لحظه‌ای به دیتابیس همین روم
      dbRef.on('value', snap => {
        const data = snap.val();
        if (data) gameState = data;
        render();
      });
    }

    function initBoard() {
      const board = document.getElementById('board');
      board.style.gridTemplateColumns = `repeat(${gridSize * 2 - 1}, auto)`;
      board.innerHTML = '';

      for (let r = 0; r < gridSize * 2 - 1; r++) {
        for (let c = 0; c < gridSize * 2 - 1; c++) {
          const div = document.createElement('div');
          if (r % 2 === 0 && c % 2 === 0) {
            div.className = 'dot';
          } else if (r % 2 === 0 && c % 2 !== 0) {
            div.className = 'hline';
            div.id = `h_${r/2}_${Math.floor(c/2)}`;
            div.onclick = () => playMove(div.id);
          } else if (r % 2 !== 0 && c % 2 === 0) {
            div.className = 'vline';
            div.id = `v_${Math.floor(r/2)}_${c/2}`;
            div.onclick = () => playMove(div.id);
          } else {
            div.className = 'box';
            div.id = `b_${Math.floor(r/2)}_${Math.floor(c/2)}`;
          }
          board.appendChild(div);
        }
      }
    }

    function playMove(lineId) {
      if (gameState.turn !== myPlayerId) return alert('الان نوبت شما نیست!');
      if (gameState.lines && gameState.lines[lineId]) return;

      let newState = JSON.parse(JSON.stringify(gameState));
      if (!newState.lines) newState.lines = {};
      if (!newState.boxes) newState.boxes = {};
      if (!newState.score) newState.score = {1:0, 2:0};

      newState.lines[lineId] = myPlayerId;
      
      let boxesClosed = checkBoxes(newState.lines, newState.boxes);
      if (boxesClosed > 0) {
        newState.score[myPlayerId] += boxesClosed;
      } else {
        newState.turn = myPlayerId === 1 ? 2 : 1;
      }

      dbRef.set(newState);
    }

    function checkBoxes(lines, boxes) {
      let closed = 0;
      for (let r = 0; r < gridSize - 1; r++) {
        for (let c = 0; c < gridSize - 1; c++) {
          let boxId = `b_${r}_${c}`;
          if (!boxes[boxId]) {
            if (lines[`h_${r}_${c}`] && lines[`h_${r+1}_${c}`] && lines[`v_${r}_${c}`] && lines[`v_${r}_${c+1}`]) {
              boxes[boxId] = myPlayerId;
              closed++;
            }
          }
        }
      }
      return closed;
    }

    function render() {
      if (!gameState.lines) gameState.lines = {};
      if (!gameState.boxes) gameState.boxes = {};
      
      document.querySelectorAll('.hline, .vline').forEach(el => {
        el.className = el.className.replace(/ p1| p2| taken/g, '');
        if (gameState.lines[el.id]) el.classList.add(`p${gameState.lines[el.id]}`, 'taken');
      });

      document.querySelectorAll('.box').forEach(el => {
        el.className = el.className.replace(/ p1| p2/g, '');
        if (gameState.boxes[el.id]) el.classList.add(`p${gameState.boxes[el.id]}`);
      });

      const scores = gameState.score || {1:0, 2:0};
      document.getElementById('score').innerText = `قرمز: ${scores[1]} | آبی: ${scores[2]}`;
      
      document.getElementById('status').innerText = gameState.turn === myPlayerId ? `نوبت شماست` : `منتظر حرکت حریف...`;
      document.getElementById('status').style.color = gameState.turn === myPlayerId ? "#2ecc71" : "#e74c3c";
    }
  </script>
</body>
</html>
