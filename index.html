<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی نقطه و خط</title>
  
  <!-- اتصال به فایربیس -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <style>
    body { font-family: Tahoma, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; margin: 0; }
    #board { display: inline-grid; gap: 2px; background: #222; padding: 5px; border-radius: 8px; margin-top: 15px; direction: ltr;}
    .dot { width: 15px; height: 15px; background: #fff; border-radius: 50%; }
    .hline { width: 60px; height: 15px; background: #444; cursor: pointer; transition: 0.2s; }
    .vline { width: 15px; height: 60px; background: #444; cursor: pointer; transition: 0.2s; }
    .box { width: 60px; height: 60px; background: #333; transition: 0.3s; }
    .hline:hover, .vline:hover { background: #777; }
    .p1 { background: #e74c3c !important; } /* قرمز */
    .p2 { background: #3498db !important; } /* آبی */
    .taken { pointer-events: none; }
    .controls button { padding: 10px 20px; margin: 5px; font-size: 15px; cursor: pointer; border: none; border-radius: 5px; color: white; }
    .btn-reset { background: #2ecc71; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px;}
  </style>
</head>
<body>

  <h2>نقطه و خط آنلاین</h2>
  
  <div class="controls" id="roleSelection">
    <p>برای شروع، هرکدام یک رنگ را انتخاب کنید:</p>
    <button onclick="setPlayer(1)" style="background: #e74c3c;">من قرمز هستم (بازیکن ۱)</button>
    <button onclick="setPlayer(2)" style="background: #3498db;">من آبی هستم (بازیکن ۲)</button>
  </div>
  
  <h3 id="status">در حال ارتباط با سرور...</h3>
  <h4 id="score">قرمز: 0 | آبی: 0</h4>
  
  <div id="board"></div>
  <br>
  <button class="btn-reset" onclick="resetGame()">شروع مجدد بازی</button>

  <script>
    // اطلاعات دیتابیس شما
    const firebaseConfig = {
      apiKey: "AIzaSyBPL2MDK71tCkqJe_mWnEM9yEmUKKJRNsE",
      authDomain: "dot-and-box-36ebb.firebaseapp.com",
      databaseURL: "https://dot-and-box-36ebb-default-rtdb.firebaseio.com",
      projectId: "dot-and-box-36ebb",
      storageBucket: "dot-and-box-36ebb.firebasestorage.app",
      messagingSenderId: "377564931303",
      appId: "1:377564931303:web:bbf65d3ced0e9b9e906e42"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('game_room_1'); // مسیر ذخیره اطلاعات

    const gridSize = 5; // تعداد نقطه‌ها در هر ردیف (شبکه 4x4 مربع)
    let myPlayerId = null;
    let gameState = { lines: {}, boxes: {}, turn: 1, score: {1: 0, 2: 0} };

    // انتخاب نقش
    function setPlayer(id) {
      myPlayerId = id;
      document.getElementById('roleSelection').style.display = 'none';
      render();
    }

    // ساخت ظاهر شبکه بازی
    function initBoard() {
      const board = document.getElementById('board');
      board.style.gridTemplateColumns = `repeat(${gridSize * 2 - 1}, auto)`;
      board.innerHTML = '';

      for (let r = 0; r < gridSize * 2 - 1; r++) {
        for (let c = 0; c < gridSize * 2 - 1; c++) {
          const div = document.createElement('div');
          if (r % 2 === 0 && c % 2 === 0) {
            div.className = 'dot';
          } else if (r % 2 === 0 && c % 2 !== 0) {
            div.className = 'hline';
            div.id = `h_${r/2}_${Math.floor(c/2)}`;
            div.onclick = () => playMove(div.id);
          } else if (r % 2 !== 0 && c % 2 === 0) {
            div.className = 'vline';
            div.id = `v_${Math.floor(r/2)}_${c/2}`;
            div.onclick = () => playMove(div.id);
          } else {
            div.className = 'box';
            div.id = `b_${Math.floor(r/2)}_${Math.floor(c/2)}`;
          }
          board.appendChild(div);
        }
      }
    }

    // انجام حرکت
    function playMove(lineId) {
      if (!myPlayerId) return alert('اول رنگ خود را انتخاب کنید!');
      if (gameState.turn !== myPlayerId) return alert('الان نوبت شما نیست!');
      if (gameState.lines && gameState.lines[lineId]) return; // خط قبلا کشیده شده

      let newState = JSON.parse(JSON.stringify(gameState));
      if (!newState.lines) newState.lines = {};
      if (!newState.boxes) newState.boxes = {};
      if (!newState.score) newState.score = {1:0, 2:0};

      newState.lines[lineId] = myPlayerId; // ثبت خط
      
      let boxesClosed = checkBoxes(newState.lines, newState.boxes);
      if (boxesClosed > 0) {
        // اگر مربعی کامل شد، امتیاز بگیر و نوبت را نگه دار
        newState.score[myPlayerId] += boxesClosed;
      } else {
        // در غیر این صورت نوبت عوض می‌شود
        newState.turn = myPlayerId === 1 ? 2 : 1;
      }

      db.set(newState); // ارسال به فایربیس
    }

    // بررسی کامل شدن مربع‌ها
    function checkBoxes(lines, boxes) {
      let closed = 0;
      for (let r = 0; r < gridSize - 1; r++) {
        for (let c = 0; c < gridSize - 1; c++) {
          let boxId = `b_${r}_${c}`;
          if (!boxes[boxId]) { // اگر مربع قبلا گرفته نشده
            if (lines[`h_${r}_${c}`] && lines[`h_${r+1}_${c}`] && lines[`v_${r}_${c}`] && lines[`v_${r}_${c+1}`]) {
              boxes[boxId] = myPlayerId;
              closed++;
            }
          }
        }
      }
      return closed;
    }

    // نمایش تغییرات روی صفحه
    function render() {
      if (!gameState.lines) gameState.lines = {};
      if (!gameState.boxes) gameState.boxes = {};
      
      document.querySelectorAll('.hline, .vline').forEach(el => {
        el.className = el.className.replace(/ p1| p2| taken/g, '');
        if (gameState.lines[el.id]) {
          el.classList.add(`p${gameState.lines[el.id]}`, 'taken');
        }
      });

      document.querySelectorAll('.box').forEach(el => {
        el.className = el.className.replace(/ p1| p2/g, '');
        if (gameState.boxes[el.id]) {
          el.classList.add(`p${gameState.boxes[el.id]}`);
        }
      });

      const scores = gameState.score || {1:0, 2:0};
      document.getElementById('score').innerText = `قرمز: ${scores[1]} | آبی: ${scores[2]}`;
      
      const statusText = gameState.turn === 1 ? "نوبت قرمز" : "نوبت آبی";
      if (!myPlayerId) {
        document.getElementById('status').innerText = "منتظر انتخاب بازیکن...";
      } else {
        document.getElementById('status').innerText = gameState.turn === myPlayerId ? `نوبت شماست` : `صبر کنید...`;
        document.getElementById('status').style.color = gameState.turn === myPlayerId ? "#2ecc71" : "#e74c3c";
      }
    }

    // دریافت لحظه‌ای اطلاعات از فایربیس
    db.on('value', snap => {
      const data = snap.val();
      if (data) {
        gameState = data;
      } else {
        gameState = { lines: {}, boxes: {}, turn: 1, score: {1: 0, 2: 0} }; // دیتابیس خالی است
      }
      render();
    });

    // دکمه شروع مجدد
    function resetGame() {
      if(confirm('آیا مطمئن هستید که می‌خواهید بازی را ریست کنید؟')) {
        db.set({ lines: {}, boxes: {}, turn: 1, score: {1: 0, 2: 0} });
      }
    }

    initBoard();
  </script>
</body>
</html>
